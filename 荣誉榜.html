<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面包护卫队官网｜荣誉榜</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(rgba(0, 0, 20, 0.55), rgba(0, 0, 20, 0.55)),
                        url('星空.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        /* 顶部导航栏：Logo 在左上角，链接靠左排列 */
        nav {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 8px 24px;
        }

        nav .brand img {
            height: 38px;
            width: auto;
            display: block;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 20px;
        }

        nav a:hover,
        nav a.current {
            color: greenyellow;
        }

        .wrap {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 16px;
            text-align: center;
        }

        /* 图片自适应：不超出容器，保持比例 */
        img {
            max-width: 100%;
            height: auto;
            margin: 20px auto;
        }

        h1 {
            color: red;
            font-size: 32px;
            margin-bottom: 10px;
        }

        p.text {
            color: #ffffff;
            width: 100%;
            max-width: 800px;
            margin: 16px auto;
            line-height: 1.8;
            font-size: 17px;
        }

        /* 证书为竖版图片，限制高度以获得最佳显示效果 */
        .cert {
            max-height: 75vh;
            max-width: 90%;
            border: 6px solid #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>
    <nav>
        <a class="brand" href="index.html"><img src="logo2.png" alt="面包护卫队 Logo"></a>
        <a href="index.html">主页</a>
        <a href="关于我们.html">关于我们</a>
        <a class="current" href="荣誉榜.html">荣誉榜</a>
        <a href="内创游戏.html">内创游戏</a>
    </nav>

    <div class="wrap">
        <h1>荣誉榜</h1>
        <p class="text">
            2025 年 6 月，主席徐翊峰荣获第五届全国青少年科技教育成果展示大赛（省级区域赛）算法思维挑战赛一等奖
        </p>
        <img class="cert" src="1.jpg" alt="全国青少年科技教育成果展示大赛一等奖证书">
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面包护卫队官网｜内创游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(rgba(0, 0, 20, 0.55), rgba(0, 0, 20, 0.55)),
                        url('星空.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }

        /* 顶部导航栏：Logo 在左上角，链接靠左排列 */
        nav {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 8px 24px;
        }

        nav .brand img {
            height: 38px;
            width: auto;
            display: block;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 20px;
        }

        nav a:hover,
        nav a.current {
            color: greenyellow;
        }

        .wrap {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 16px;
            text-align: center;
        }

        h1 {
            color: #ffffff;
            font-size: 32px;
            margin-bottom: 10px;
        }

        p.text {
            color: #ffffff;
            width: 100%;
            max-width: 800px;
            margin: 16px auto;
            line-height: 1.8;
            font-size: 17px;
        }

        /* 游戏入口卡片 */
        .game {
            display: inline-block;
            width: 100%;
            max-width: 420px;
            margin: 30px auto;
            padding: 40px 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid greenyellow;
            border-radius: 16px;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }

        .game:hover {
            background: rgba(154, 205, 50, 0.18);
            transform: translateY(-4px);
        }

        .game-name {
            display: block;
            color: greenyellow;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .game-desc {
            display: block;
            color: #ffffff;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <nav>
        <a class="brand" href="index.html"><img src="logo2.png" alt="面包护卫队 Logo"></a>
        <a href="index.html">主页</a>
        <a href="关于我们.html">关于我们</a>
        <a href="荣誉榜.html">荣誉榜</a>
        <a class="current" href="内创游戏.html">内创游戏</a>
    </nav>

    <div class="wrap">
        <h1>内创游戏</h1>
        <p class="text">
            面包护卫队自主研发的游戏作品
        </p>
        <a class="game" href="https://hajifeng1.github.io/mianbaosha/" target="_blank" rel="noopener">
            <span class="game-name">面包杀</span>
            <span class="game-desc">点击进入游戏 →</span>
        </a>
    </div>
</body>
</html>
